<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Fond Rouge SSIAP -->
  <rect x="0" y="0" width="400" height="400" fill="#c0392b" />
  
  <!-- Fond Bleu Sûreté -->
  <rect x="400" y="0" width="400" height="400" fill="#2980b9" />
  
  <!-- Ligne de séparation centrale -->
  <line x1="400" y1="0" x2="400" y2="400" stroke="#ffffff" stroke-width="4" opacity="0.3"/>

  <!-- Textes SSIAP -->
  <circle cx="200" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">SSIAP</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="18" fill="#f1a9a0" text-anchor="middle">SÉCURITÉ INCENDIE</text>

  <!-- Textes SURETE -->
  <circle cx="600" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">SÛRETÉ</text>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="18" fill="#89c4f4" text-anchor="middle">MALVEILLANCE</text>
</svg>
